
<!DOCTYPE html>
<html>
<head>
    <title>Search Course - Manisha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header><h1>MANISHA COURSE REGISTRATION</h1></header>

<nav>
    <a href="index.html">Home</a>
    <a href="list.html">List Courses</a>
    <a href="listOne.html">Search Course</a>
    <a href="insert.html">Register Course</a>
    <a href="update.html">Update Course</a>
    <a href="delete.html">Delete Course</a>
</nav>

<div class="container">
    <h2>SEARCH COURSE</h2>

    Course ID:
    <input type="number" id="course_id">

    <button onclick="searchCourse()">Search</button>

    <p id="message"></p>

    <table border="1" id="courseTable">
        <tr>
            <th>Course ID</th>
            <th>Course Name</th>
            <th>Department</th>
            <th>Semester</th>
            <th>Number</th>
            <th>Age</th>
        </tr>
    </table>
</div>

<script>
function searchCourse() {
    let id = document.getElementById("course_id").value;

    if (id === "") {
        alert("Please enter Course ID");
        return;
    }

    fetch("/courses/" + id)
    .then(response => response.json())
    .then(data => {
        let table = document.getElementById("courseTable");

        table.innerHTML = `
            <tr>
                <th>Course ID</th>
                <th>Course Name</th>
                <th>Department</th>
                <th>Semester</th>
                <th>Number</th>
                <th>Age</th>
            </tr>`;

        if (data.length === 0) {
            document.getElementById("message").textContent =
                "Course Not Found";
            return;
        }

        let c = data[0];

        table.innerHTML += `
            <tr>
                <td>${c.course_id}</td>
                <td>${c.course_name}</td>
                <td>${c.department}</td>
                <td>${c.semester}</td>
                <td>${c.number}</td>
                <td>${c.age}</td>
            </tr>`;

        document.getElementById("message").textContent =
            "Course Found Successfully";
    })
    .catch(error => {
        alert("Error searching course: " + error.message);
    });
}
</script>

</body>
</html>
